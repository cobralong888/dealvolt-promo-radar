name: update

# 定时重跑：读公开源 -> 写 data/offers.json -> 提交。
# Cloudflare Pages 连着这个仓库，提交即触发 python build.py 重新出站。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read public brand sources
        run: python scraper.py

      - name: Build site
        run: python build.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4
          wrangler pages deploy site/ --project-name dealvolt-promo-radar --branch main

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          if git diff --staged --quiet; then
            echo "no change in data/offers.json"
          else
            git commit -m "chore: refresh offers $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
